services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jykstoreminio
      MINIO_ROOT_PASSWORD: jykstoreminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 jykstoreminio jykstoreminio123 &&
      mc mb -p local/jykstore-payloads-test || true &&
      mc anonymous set none local/jykstore-payloads-test &&
      exit 0
      "
