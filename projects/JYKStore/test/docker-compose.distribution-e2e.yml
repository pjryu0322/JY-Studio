services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jykstore
      POSTGRES_PASSWORD: jykstore
      POSTGRES_DB: jykstore_distribution_e2e
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jykstore -d jykstore_distribution_e2e"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jykstoreminio
      MINIO_ROOT_PASSWORD: jykstoreminio123
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 jykstoreminio jykstoreminio123 &&
      mc mb -p local/jykstore-payloads-e2e || true &&
      mc anonymous set none local/jykstore-payloads-e2e &&
      exit 0
      "
