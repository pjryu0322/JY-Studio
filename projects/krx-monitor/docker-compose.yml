services:
  postgres:
    image: postgres:16-alpine
    container_name: krx-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krx
      POSTGRES_PASSWORD: krx
      POSTGRES_DB: krx_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
